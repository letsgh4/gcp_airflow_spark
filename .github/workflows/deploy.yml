name: Deploy

# Ręczne wdrożenie infrastruktury. Domyślnie tylko lint + terraform plan.
#
# Wymagana konfiguracja repo (Settings → Secrets and variables → Actions):
#   Variables: GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT,
#              TF_STATE_BUCKET, TF_STATE_PREFIX, SSH_PUBLIC_KEY
#   Secrets:   AIRFLOW_ADMIN_PASSWORD, AIRFLOW_ANALYST_PASSWORD,
#              JUPYTERHUB_ADMIN_PASSWORD, JUPYTERHUB_ANALYST_PASSWORD, GRAFANA_ADMIN_PASSWORD
#   Environment: "production" (job apply) — dodaj w nim wymaganych recenzentów.
#
# Bucket na stan tworzy administrator poza tym Terraformem. Istniejący lokalny stan
# administrator migruje przed pierwszym uruchomieniem:
#   terraform -chdir=terraform init -migrate-state \
#     -backend-config="bucket=<TF_STATE_BUCKET>" -backend-config="prefix=<TF_STATE_PREFIX>"
#
# UWAGA: artefakt z planem zawiera hasła (metadane VM) i nie jest szyfrowany.
# W publicznym repo może go pobrać każdy zalogowany użytkownik GitHuba przez 1 dzień.

on:
  workflow_dispatch:
    inputs:
      run_apply:
        description: "Wykonaj terraform apply (tylko z main). Wyłączone = sam plan."
        type: boolean
        default: false
      run_smoke_test:
        description: "Sprawdź bucket DAG-ów i Airflow /health na masterze (tylko z main)."
        type: boolean
        default: false

permissions:
  contents: read

# Jeden stan Terraform — nigdy dwa wdrożenia naraz, bez przerywania trwającego.
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.17.1" # ta sama wersja co w lint.yml
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  plan:
    name: Terraform plan
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Workload Identity Federation — bez kluczy JSON
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_ssh_pub_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_airflow_admin_password: ${{ secrets.AIRFLOW_ADMIN_PASSWORD }}
      TF_VAR_airflow_analyst_password: ${{ secrets.AIRFLOW_ANALYST_PASSWORD }}
      TF_VAR_jupyterhub_admin_password: ${{ secrets.JUPYTERHUB_ADMIN_PASSWORD }}
      TF_VAR_jupyterhub_analyst_password: ${{ secrets.JUPYTERHUB_ANALYST_PASSWORD }}
      TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check configuration
        run: |
          missing=0
          for v in TF_STATE_BUCKET TF_STATE_PREFIX TF_VAR_project_id TF_VAR_ssh_pub_key \
                   TF_VAR_airflow_admin_password TF_VAR_airflow_analyst_password \
                   TF_VAR_jupyterhub_admin_password TF_VAR_jupyterhub_analyst_password \
                   TF_VAR_grafana_admin_password; do
            if [[ -z "${!v}" ]]; then echo "::error::Brak wartości dla $v (zmienna/sekret repo)"; missing=1; fi
          done
          exit "$missing"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${TF_STATE_PREFIX}"

      - name: terraform validate
        run: terraform -chdir=terraform validate -no-color

      - name: terraform plan
        run: |
          terraform -chdir=terraform plan -lock-timeout=5m -no-color -out=tfplan
          {
            echo "### Terraform plan"
            echo '```'
            terraform -chdir=terraform show -no-color tfplan | grep -E '^(Plan:|No changes|Changes to Outputs)' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform apply
    needs: plan
    if: github.ref == 'refs/heads/main' && inputs.run_apply
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production # czeka na zatwierdzenie (wymagani recenzenci)
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
      # Jedyne outputy wypisywane w logu i podsumowaniu joba.
      PUBLIC_OUTPUTS: "master_external_ip dag_bucket ssh_command"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Plan z tego samego uruchomienia (bez run-id = bieżący run).
      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: terraform

      - name: terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${TF_STATE_PREFIX}"

      # Blok "Outputs:" z apply jest obcinany — outputy wypisuje tylko następny krok.
      - name: terraform apply
        run: |
          set -o pipefail
          terraform -chdir=terraform apply -lock-timeout=5m -no-color tfplan | sed '/^Outputs:/,$d'

      - name: Show outputs
        run: |
          echo "### Outputs" >> "$GITHUB_STEP_SUMMARY"
          for name in $PUBLIC_OUTPUTS; do
            value=$(terraform -chdir=terraform output -raw "$name")
            echo "$name = $value"
            echo "- \`$name\` = \`$value\`" >> "$GITHUB_STEP_SUMMARY"
          done

  smoke-test:
    name: Smoke test
    needs: [plan, apply]
    # Działa też bez apply (apply pominięty) — sprawdza wtedy aktualne wdrożenie.
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && inputs.run_smoke_test
      && needs.plan.result == 'success'
      && (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
      # Świeży master instaluje wszystko ~10–12 min po apply.
      HEALTH_TIMEOUT_SECONDS: "1200"
      HEALTH_INTERVAL_SECONDS: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Read outputs from state
        id: tf
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${TF_STATE_PREFIX}" >/dev/null
          {
            echo "master_ip=$(terraform -chdir=terraform output -raw master_external_ip)"
            echo "dag_bucket=$(terraform -chdir=terraform output -raw dag_bucket)"
          } >> "$GITHUB_OUTPUT"

      # gcloud jest preinstalowany na ubuntu-24.04; auth ustawia mu poświadczenia WIF.
      - name: Verify DAG bucket
        env:
          DAG_BUCKET: ${{ steps.tf.outputs.dag_bucket }}
        run: |
          gcloud storage buckets describe "gs://${DAG_BUCKET}" --format="value(name)"
          echo "✓ Bucket gs://${DAG_BUCKET} istnieje"

      - name: Airflow /health
        env:
          MASTER_IP: ${{ steps.tf.outputs.master_ip }}
        run: |
          url="http://${MASTER_IP}:30080/health"
          deadline=$(( $(date +%s) + HEALTH_TIMEOUT_SECONDS ))
          while (( $(date +%s) < deadline )); do
            if body=$(curl -fsS --max-time 10 "$url" 2>/dev/null) \
               && jq -e '.metadatabase.status == "healthy" and .scheduler.status == "healthy"' <<<"$body" >/dev/null 2>&1; then
              echo "✓ Airflow healthy: $body"
              exit 0
            fi
            echo "… Airflow jeszcze niegotowy, ponawiam za ${HEALTH_INTERVAL_SECONDS} s"
            sleep "$HEALTH_INTERVAL_SECONDS"
          done
          echo "::error::Airflow nie jest healthy po ${HEALTH_TIMEOUT_SECONDS}s: $url"
          exit 1
